# Marks profiles/reviewer-ci as its OWN standalone pnpm workspace root — without
# this file, pnpm's workspace-root detection walks up and finds
# packages/dsh-maestro-review's own pnpm-workspace.yaml two levels up (this
# profile is nested inside that package's directory tree), silently folding
# the profile into that unrelated workspace instead of installing it
# independently (verified 2026-09-03: `pnpm --dir profiles/reviewer-ci install`
# printed "Scope: all 2 workspace projects" and resolved relative to `../..`
# without this file present).
packages: []
minimumReleaseAgeExclude:
  - '@ddtcorex/dsh-maestro-review@0.3.1'
  - '@ddtcorex/maestro-skills@2.11.0'
