# docker/ci-settings.deepseek.yaml — template baked to /app/settings.yaml
# (DSH_HOME), the sole default route. __CI_MANAGED__ marks this file as ours:
# entrypoint.sh only overlays the generic OpenAI-compatible route (when
# REVIEW_LLM_API_KEY is set) when the marker is present, so a job-mounted
# /app/settings.yaml passes through untouched. Serves deepseek-official
# straight from api.deepseek.com — needs a LIVE deepseek.com key (a
# zen-gateway key will 401 here). Contains NO secrets.
llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  baseURL: https://api.deepseek.com
  models:
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
    - id: deepseek-v4-flash
      name: DeepSeek V4 Flash
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek V4 Flash Vision Exp
      inputModalities:
        - text
        - image
agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
