# docker/ci-settings.yaml — baked to /app/settings.yaml (DSH_HOME) in the reviewer image.
#
# Activates the `opencode-go` LLM provider route (OpenAI-compatible gateway) so
# REVIEW_MODEL_PROVIDER=opencode-go works with only a key — no settings mount needed.
# Contains NO secrets: the key resolves at call time from the env var named in
# apiKeyEnv (pass OPENCODE_GO_API_KEY with --env-file / CI secret). A reviewer
# job that mounts its own /app/settings.yaml overrides this file entirely.
#
# Deliberately does NOT set agent-default-model: the default review model stays
# the host default (unchanged behavior); the pin applies only when the
# REVIEW_MODEL_PROVIDER/REVIEW_MODEL pair from templates/reviewer-project.gitlab-ci.yml
# selects this route via the orchestrator's row-config reviewModel.
llm-pi-ai:
  providers:
    opencode-go:
      displayName: OpenCode Go
      apiKeyEnv: OPENCODE_GO_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1
      models:
        - id: muse-spark-1.3-contributor
          name: Muse Spark 1.3 Contributor
