# docker/ci-settings.yaml — template baked to /app/settings.yaml (DSH_HOME).
# entrypoint.sh substitutes __OPENCODE_MODEL__ (from $OPENCODE_MODEL, default
# muse-spark-1.3-contributor) before dsh boots, so the opencode model is one env
# variable. A job-mounted /app/settings.yaml contains no placeholder and passes
# through untouched.
#
# Mirrors this host's llm-pi-ai (opencode-go), llm-deepseek, and agent-default-model
# sections — the reviewer container serves models the way DSH does. Keys resolve
# at call time from each apiKeyEnv (pass with --env-file / CI secrets).
# Contains NO secrets — only route definitions, model catalogs, and env var NAMES.
#
# Sections intentionally NOT mirrored: permission/sidebar/presets/onboarding are
# interactive-host concerns; a headless CI run must not inherit danger-full-access
# or UI state. Only the model-serving surface is mirrored.
llm-pi-ai:
  providers:
    opencode-go:
      displayName: OpenCode Go
      apiKeyEnv: OPENCODE_GO_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1
      models:
        - id: __OPENCODE_MODEL__
          name: CI Opencode Model
llm-deepseek:
  apiKeyEnv: OPENCODE_GO_API_KEY
  baseURL: https://opencode.ai/zen/go/v1
  models:
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
    - id: deepseek-v4-flash
      name: DeepSeek V4 Flash
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek V4 Flash Vision Exp
      inputModalities:
        - text
        - image
agent-default-model:
  provider: opencode-go
  model: __OPENCODE_MODEL__
