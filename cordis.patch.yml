# dsh-maestro-review bundle patch — 4 rows as spec §4
# RPC channel: /dsh-maestro-review (loopback, see src/index.ts + src/settings-rpc.ts)
# channel: /dsh-maestro-review
- insert:
    # Mounts the package root (lib/index.js -> apply()). Required: `dsh plugin add`
    # applies ONLY the rows in this file, so without it the skill-provider
    # registration inside apply() never runs and the bundled dsh-native-tools
    # skill is silently absent. `skills` is the only service apply() reads, and
    # it is declared rather than softly read so the provider registers after the
    # skills service exists — a headless/CI profile has no web `connection`, and
    # declaring that unused service left this row pending forever (boot failed
    # with "1 entry did not activate ... waiting for service: connection"):
    # apply() never touches it, and the settings RPC that does lives in its own
    # row (maestro-review-settings-rpc), which such a profile disables.
    - id: maestro-review-host
      name: '@ddtcorex/dsh-maestro-review'
      inject: ['skills']
    - id: maestro-review-webhook
      name: '@ddtcorex/dsh-maestro-review/lib/providers/gitlab.js'
      config:
        secret: !!js process.env.MAESTRO_GITLAB_WEBHOOK_SECRET
        botUsername: maestro-bot
    - id: maestro-review-orchestrator
      name: '@ddtcorex/dsh-maestro-review/lib/orchestrator.js'
      config:
        gitlabBaseUrl: https://gitlab.example.com
        gitlabToken: !!js process.env.MAESTRO_GITLAB_TOKEN
        botUsername: maestro-bot
        projectMappings: []
    - id: maestro-review-settings-rpc
      name: '@ddtcorex/dsh-maestro-review/lib/settings-rpc.js'
      # rpc.handle registers a webServer route inside an effect fiber which carries only the row's inject (not the module's);
      # without webServer the row fails on harnesses that provide webServer after rows apply
      # (DSH 0.1.5-rc.1+).
      inject: ['connection', 'maestroTunnel', 'webServer']
